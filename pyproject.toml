[build-system]
requires = ["uv_build>=0.11.22,<0.12"]
build-backend = "uv_build"

[project]
name = "sports-spoiler-detector"
version = "0.1.0"
description = "Sports spoiler detector backend server"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "deepface>=0.0.100",
    "easyocr>=1.7.2",
    "fastapi[standard]>=0.136.3",
    "gliner2>=1.3.1",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "setfit>=1.1.3",
    "tf-keras>=2.21.0",
    "transformers>=5,<6",
    "ultralytics>=8.4.77",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
preview = true
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
fixable = ["ALL"]
unfixable = [
    "D",
    "I",
]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T201", "S101", "ARG", "FBT", "PLR2004", "S311"]
