spring:
  application:
    name: web-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  forward-headers-strategy: native

llm-worker:
  base-url: ${LLM_WORKER_BASE_URL}
  connect-timeout: 3s
  read-timeout: 60s
